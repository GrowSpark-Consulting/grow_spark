<!--
  Case-study visual — "Reducing production downtime through a redesigned
  operating model". Vector rather than photography: it stays crisp at any
  card size, weighs a few KB, and draws straight from the design tokens so
  it can never drift from the brand palette. Inlined (not <img>) so the
  Manrope/Inter faces and token colors cascade into it.
-->
<svg class="w-full h-auto block" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="cs-visual-title cs-visual-desc">
  <title id="cs-visual-title">Operating model transformation: before, diagnose, redesign, after</title>
  <desc id="cs-visual-desc">A four-stage diagram of a precision manufacturing line. On the left, one workstation is paused and the flow is constricted at a bottleneck. The centre shows the bottleneck identified in a small bar chart and the process flow rerouted. On the right, all workstations run and the flow is even. Below, downtime trends down 34 percent and output trends up 18 percent.</desc>

  <defs>
    <linearGradient id="cs-fade-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A3B2E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9A3B2E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cs-fade-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B5E45" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B5E45" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="#FFFFFF"/>

  <!-- Phase dividers -->
  <g stroke="#E4E6E8" stroke-width="1">
    <line x1="250" y1="34" x2="250" y2="300"/>
    <line x1="480" y1="34" x2="480" y2="300"/>
    <line x1="710" y1="34" x2="710" y2="300"/>
  </g>

  <!-- Phase labels -->
  <g style="font-family:var(--font-body);font-size:10.5px;font-weight:700;letter-spacing:0.14em;" fill="#696D72" text-anchor="middle">
    <text x="135" y="60">BEFORE</text>
    <text x="365" y="60">DIAGNOSE</text>
    <text x="595" y="60">REDESIGN</text>
    <text x="825" y="60">AFTER</text>
  </g>

  <!-- ================= BEFORE: one station paused, flow constricted ================= -->
  <g>
    <!-- conveyor: solid up to the bottleneck, dashed through it -->
    <line x1="44" y1="228" x2="150" y2="228" stroke="#D3D6D8" stroke-width="2" stroke-linecap="round"/>
    <line x1="150" y1="228" x2="196" y2="228" stroke="#9A3B2E" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.55"/>
    <line x1="196" y1="228" x2="228" y2="228" stroke="#D3D6D8" stroke-width="2" stroke-linecap="round"/>

    <!-- bottleneck pinch -->
    <path d="M168 218 L176 228 L168 238" fill="none" stroke="#9A3B2E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <!-- station 1 — running -->
    <rect x="44" y="160" width="48" height="56" rx="3" fill="#FFFFFF" stroke="#14171A" stroke-width="1.25"/>
    <line x1="54" y1="200" x2="82" y2="200" stroke="#E4E6E8" stroke-width="1.5"/>
    <circle cx="84" cy="150" r="3.5" fill="#D3D6D8"/>

    <!-- station 2 — paused, with a downtime indicator -->
    <rect x="112" y="160" width="48" height="56" rx="3" fill="#FBEEEC" stroke="#9A3B2E" stroke-width="1.25" opacity="0.9"/>
    <g stroke="#9A3B2E" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="128" y1="180" x2="128" y2="196"/>
      <line x1="140" y1="180" x2="140" y2="196"/>
    </g>
    <circle cx="152" cy="150" r="3.5" fill="#9A3B2E"/>
    <rect x="112" y="246" width="30" height="4" rx="2" fill="#9A3B2E" opacity="0.35"/>

    <!-- station 3 — starved by the bottleneck -->
    <rect x="180" y="160" width="48" height="56" rx="3" fill="#FFFFFF" stroke="#D3D6D8" stroke-width="1.25"/>
    <line x1="190" y1="200" x2="218" y2="200" stroke="#E4E6E8" stroke-width="1.5"/>
    <circle cx="220" cy="150" r="3.5" fill="#D3D6D8"/>
  </g>

  <!-- ================= DIAGNOSE: the constraint located ================= -->
  <g>
    <!-- callout from the paused station into the analysis -->
    <path d="M160 252 C 210 282, 250 268, 292 240" fill="none" stroke="#D3D6D8" stroke-width="1.25" stroke-dasharray="2 4"/>

    <rect x="286" y="140" width="158" height="104" rx="6" fill="#FFFFFF" stroke="#E4E6E8" stroke-width="1"/>
    <line x1="300" y1="192" x2="430" y2="192" stroke="#E4E6E8" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- utilisation by station; the tall bar is the constraint -->
    <g>
      <rect x="304" y="200" width="12" height="24" rx="1.5" fill="#D3D6D8"/>
      <rect x="330" y="186" width="12" height="38" rx="1.5" fill="#D3D6D8"/>
      <rect x="356" y="164" width="12" height="60" rx="1.5" fill="#9A3B2E" opacity="0.85"/>
      <rect x="382" y="196" width="12" height="28" rx="1.5" fill="#D3D6D8"/>
      <rect x="408" y="206" width="12" height="18" rx="1.5" fill="#D3D6D8"/>
    </g>
    <line x1="300" y1="224" x2="430" y2="224" stroke="#D3D6D8" stroke-width="1"/>

    <!-- ring marking the constraint -->
    <circle cx="362" cy="164" r="11" fill="none" stroke="#9A3B2E" stroke-width="1.25" opacity="0.55"/>
  </g>

  <!-- ================= REDESIGN: the flow rerouted ================= -->
  <g>
    <!-- former routing, retired -->
    <path d="M516 172 H 566 V 232 H 616" fill="none" stroke="#E4E6E8" stroke-width="1.5" stroke-dasharray="3 4"/>
    <!-- new routing -->
    <path d="M516 172 H 596 V 202 H 676" fill="none" stroke="#0B5E45" stroke-width="1.75" stroke-linejoin="round"/>

    <circle cx="516" cy="172" r="5" fill="#FFFFFF" stroke="#14171A" stroke-width="1.5"/>
    <circle cx="596" cy="172" r="5" fill="#FFFFFF" stroke="#14171A" stroke-width="1.5"/>
    <circle cx="596" cy="202" r="5" fill="#0B5E45"/>
    <circle cx="676" cy="202" r="5" fill="#FFFFFF" stroke="#0B5E45" stroke-width="1.5"/>
    <circle cx="616" cy="232" r="4.5" fill="#FFFFFF" stroke="#E4E6E8" stroke-width="1.5"/>

    <!-- capacity rebalanced across the line -->
    <g fill="#0B5E45" opacity="0.28">
      <rect x="516" y="252" width="34" height="4" rx="2"/>
      <rect x="560" y="252" width="34" height="4" rx="2"/>
      <rect x="604" y="252" width="34" height="4" rx="2"/>
      <rect x="648" y="252" width="34" height="4" rx="2"/>
    </g>
  </g>

  <!-- ================= AFTER: even flow, every station running ================= -->
  <g>
    <line x1="734" y1="228" x2="918" y2="228" stroke="#0B5E45" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
    <g fill="none" stroke="#0B5E45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
      <path d="M772 223 l6 5 l-6 5"/>
      <path d="M840 223 l6 5 l-6 5"/>
      <path d="M894 223 l6 5 l-6 5"/>
    </g>

    <rect x="734" y="160" width="48" height="56" rx="3" fill="#FFFFFF" stroke="#14171A" stroke-width="1.25"/>
    <line x1="744" y1="200" x2="772" y2="200" stroke="#E4E6E8" stroke-width="1.5"/>
    <circle cx="774" cy="150" r="3.5" fill="#4FCB9B"/>

    <rect x="802" y="160" width="48" height="56" rx="3" fill="#FFFFFF" stroke="#14171A" stroke-width="1.25"/>
    <line x1="812" y1="200" x2="840" y2="200" stroke="#E4E6E8" stroke-width="1.5"/>
    <circle cx="842" cy="150" r="3.5" fill="#4FCB9B"/>

    <rect x="870" y="160" width="48" height="56" rx="3" fill="#FFFFFF" stroke="#14171A" stroke-width="1.25"/>
    <line x1="880" y1="200" x2="908" y2="200" stroke="#E4E6E8" stroke-width="1.5"/>
    <circle cx="910" cy="150" r="3.5" fill="#4FCB9B"/>

    <!-- throughput, evenly distributed -->
    <g fill="#0B5E45" opacity="0.28">
      <rect x="734" y="246" width="48" height="4" rx="2"/>
      <rect x="802" y="246" width="48" height="4" rx="2"/>
      <rect x="870" y="246" width="48" height="4" rx="2"/>
    </g>
  </g>

  <!-- transformation arrow across the middle -->
  <g opacity="0.9">
    <line x1="270" y1="292" x2="906" y2="292" stroke="#E4E6E8" stroke-width="1.25"/>
    <path d="M900 287 l7 5 l-7 5" fill="none" stroke="#0B5E45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= Trend lines ================= -->
  <g>
    <line x1="48" y1="446" x2="912" y2="446" stroke="#E4E6E8" stroke-width="1"/>

    <!-- downtime, falling -->
    <path d="M60 358 L128 374 L196 368 L264 396 L332 404 L400 414 L400 446 L60 446 Z" fill="url(#cs-fade-warn)"/>
    <path d="M60 358 L128 374 L196 368 L264 396 L332 404 L400 414" fill="none" stroke="#9A3B2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="400" cy="414" r="3.5" fill="#9A3B2E"/>

    <!-- output, rising -->
    <path d="M560 416 L628 404 L696 408 L764 384 L832 372 L900 356 L900 446 L560 446 Z" fill="url(#cs-fade-accent)"/>
    <path d="M560 416 L628 404 L696 408 L764 384 L832 372 L900 356" fill="none" stroke="#0B5E45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="900" cy="356" r="3.5" fill="#0B5E45"/>
  </g>

  <!-- ================= Metric callouts ================= -->
  <g style="font-family:var(--font-display);">
    <text x="60" y="492" style="font-size:23px;font-weight:800;" fill="#14171A">34%<tspan dx="6" style="font-size:17px;" fill="#9A3B2E">&#8595;</tspan></text>
    <text x="60" y="512" style="font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:0.1em;" fill="#696D72">DOWNTIME</text>

    <text x="900" y="492" text-anchor="end" style="font-size:23px;font-weight:800;" fill="#14171A">18%<tspan dx="6" style="font-size:17px;" fill="#0B5E45">&#8593;</tspan></text>
    <text x="900" y="512" text-anchor="end" style="font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:0.1em;" fill="#696D72">OUTPUT</text>
  </g>
</svg>
